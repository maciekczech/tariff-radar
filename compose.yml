services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - tariff-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  collector:
    build: .
    command: ["sh", "-c", "while true; do tariff-radar sync; sleep 21600; done"]
    volumes:
      - tariff-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  tariff-data:
