[project]
name = "tariff-radar"
version = "0.1.0"
description = "Open-source monitor for official tariff changes"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "maciekczech"}]
dependencies = [
  "fastapi>=0.116,<1",
  "feedparser>=6.0.11,<7",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
tariff-radar = "tariff_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariff_radar"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tariff_radar"]

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true
