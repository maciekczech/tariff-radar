name: Hermes / Collect tariff signals

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tariff-radar-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - run: uv sync --locked
      - name: Restore rolling database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/tariff-radar.db
          key: tariff-radar-state-${{ github.run_id }}
          restore-keys: tariff-radar-state-
      - name: Collect
        id: sync
        continue-on-error: true
        run: uv run tariff-radar --db data/tariff-radar.db sync
      - name: Render seven-day digest
        if: always()
        run: uv run tariff-radar --db data/tariff-radar.db digest --days 7 > data/digest.md
      - name: Save rolling database
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/tariff-radar.db
          key: tariff-radar-state-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tariff-radar-${{ github.run_id }}
          path: |
            data/tariff-radar.db
            data/digest.md
          retention-days: 7
      - name: Propagate collection failure
        if: steps.sync.outcome != 'success'
        run: exit 1
